name: Android Tests

# A real Android emulator on a GitHub runner (KVM), the Appium server pinned in package.json,
# and the Java tests against both.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android 15 emulator (API 35)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install Appium and the UiAutomator2 driver
        run: npm ci --no-audit --no-fund

      - name: Download My Demo App (checksum verified)
        run: |
          mkdir -p apps
          curl -sSfL --retry 3 -o apps/mda-2.3.0-27.apk             https://github.com/saucelabs/my-demo-app-android/releases/download/2.3.0/mda-2.3.0-27.apk
          echo "bd3a3d6f2d50e076b2701ed2cc6a0ca82157b40a7033cf5be9f5d084b6591ec8  apps/mda-2.3.0-27.apk" | sha256sum -c -

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the tests on the emulator
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect
          script: |
            nohup npx appium --port 4723 > appium.log 2>&1 &
            for i in $(seq 1 30); do curl -sf http://127.0.0.1:4723/status > /dev/null && break; sleep 2; done
            mvn -B test

      - name: Upload reports, screenshots and the Appium log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-test-results
          path: |
            target/surefire-reports
            target/screenshots
            appium.log
          if-no-files-found: ignore
          retention-days: 14
